name: Debian release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build release package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          /usr/bin/python3 scripts/build_deb.py "${RELEASE_TAG#v}"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes dist/*.deb dist/SHA256SUMS
